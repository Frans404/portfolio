<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" data-i18n-attr="content:pageDescription">
  <meta name="theme-color" content="#0b1220">
  <title data-i18n="pageTitle"></title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="container nav" data-i18n-attr="aria-label:navLabel">
      <a class="brand" href="#top"><span data-i18n="brandFirstInitial"></span><span class="brand-dot">.</span><span data-i18n="brandLastInitial"></span></a>
      <div class="nav-links">
        <a href="#projects" data-i18n="navProjects"></a>
        <a href="#skills" data-i18n="navSkills"></a>
        <a href="#about" data-i18n="navAbout"></a>
        <a href="#contact" data-i18n="navContact"></a>
      </div>
      <button id="language-toggle" class="lang-toggle" type="button" data-i18n="languageButton" data-i18n-attr="aria-label:languageButtonLabel"></button>
    </nav>
  </header>
  <main id="top">
    <section class="hero container">
      <div class="eyebrow"><span class="status-dot"></span><span data-i18n="eyebrow"></span></div>
      <h1><span class="name-first" data-i18n="nameFirst"></span> <span data-i18n="nameLast"> </span></h1>
      <p class="hero-title" data-i18n="heroTitle"></p>
      <p class="hero-copy" data-i18n="heroCopy"></p>
      <div class="actions">
        <a class="button primary" href="#projects" data-i18n="viewProjects"></a>
        <a class="button secondary" id="cv-link" href="cv-en.pdf" download data-i18n="downloadCV"></a>
      </div>
      <div class="hero-tags" data-i18n-list="heroTags"></div>
    </section>
    <section id="projects" class="section container">
      <div class="section-heading"><div><p class="section-kicker" data-i18n="selectedWork"></p><h2 data-i18n="projectsTitle"></h2></div><p data-i18n="projectsIntro"></p></div>
      <div class="project-grid">
        <article class="project-card" role="button" tabindex="0" aria-haspopup="dialog" data-project="p1"><div class="card-top"><span class="project-number">01</span><span class="project-icon">↗</span></div><h3 data-i18n="p1Title"></h3><p data-i18n="p1Desc"></p><div class="tags" data-i18n-list="p1Tags"></div></article>
        <article class="project-card" role="button" tabindex="0" aria-haspopup="dialog" data-project="p2"><div class="card-top"><span class="project-number">02</span><span class="project-icon">↗</span></div><h3 data-i18n="p2Title"></h3><p data-i18n="p2Desc"></p><div class="tags" data-i18n-list="p2Tags"></div></article>
        <article class="project-card" role="button" tabindex="0" aria-haspopup="dialog" data-project="p3"><div class="card-top"><span class="project-number">03</span><span class="project-icon">↗</span></div><h3 data-i18n="p3Title"></h3><p data-i18n="p3Desc"></p><div class="tags" data-i18n-list="p3Tags"></div></article>
        <article class="project-card" role="button" tabindex="0" aria-haspopup="dialog" data-project="p4"><div class="card-top"><span class="project-number">04</span><span class="project-icon">↗</span></div><h3 data-i18n="p4Title"></h3><p data-i18n="p4Desc"></p><div class="tags" data-i18n-list="p4Tags"></div></article>
        <article class="project-card" role="button" tabindex="0" aria-haspopup="dialog" data-project="p5"><div class="card-top"><span class="project-number">05</span><span class="project-icon">↗</span></div><h3 data-i18n="p5Title"></h3><p data-i18n="p5Desc"></p><div class="tags" data-i18n-list="p5Tags"></div></article>
      </div>
      <p class="project-note" data-i18n="projectNote"></p>
      <dialog id="project-dialog" class="project-dialog" aria-labelledby="project-dialog-title">
        <form method="dialog" class="project-dialog-close-row"><button class="project-dialog-close" type="submit" data-i18n-attr="aria-label:projectDialogClose">×</button></form>
        <h2 id="project-dialog-title"></h2>
        <p id="project-dialog-description"></p>
        <a id="project-dialog-link" class="button primary" target="_blank" rel="noopener noreferrer"></a>
      </dialog>
    </section>
    <section id="skills" class="section container"><div class="section-heading"><div><p class="section-kicker" data-i18n="toolkit"></p><h2 data-i18n="skillsTitle"></h2></div></div><div class="skill-grid"><div class="skill-block"><h3 data-i18n="languages"></h3><p data-i18n="languagesList"></p></div><div class="skill-block"><h3 data-i18n="dataML"></h3><p data-i18n="dataMLList"></p></div><div class="skill-block"><h3 data-i18n="tools"></h3><p data-i18n="toolsList"></p></div><div class="skill-block"><h3 data-i18n="methods"></h3><p data-i18n="methodsDesc"></p></div></div></section>
    <section id="about" class="section container"><div class="section-heading"><div><p class="section-kicker" data-i18n="background"></p><h2 data-i18n="aboutTitle"></h2></div></div><div class="about-grid"><div><p class="about-lead" data-i18n="aboutLead"></p><p class="muted" data-i18n="aboutText"></p></div><div class="timeline"><div class="timeline-item"><span data-i18n="educationDates"></span><div><h3 data-i18n="educationTitle"></h3><p data-i18n="educationPlace"></p></div></div><div class="timeline-item"><span data-i18n="aiWorkDates"></span><div><h3 data-i18n="aiWorkTitle"></h3><p data-i18n="aiWorkDesc"></p></div></div><div class="timeline-item"><span data-i18n="healthDates"></span><div><h3 data-i18n="healthTitle"></h3><p data-i18n="healthDesc"></p></div></div><div class="timeline-item"><span data-i18n="supportDates"></span><div><h3 data-i18n="supportTitle"></h3><p data-i18n="supportDesc"></p></div></div><div class="timeline-item"><span data-i18n="economicsDates"></span><div><h3 data-i18n="economicsTitle"></h3><p data-i18n="economicsDesc"></p></div></div><div class="timeline-item"><span data-i18n="gisDates"></span><div><h3 data-i18n="gisTitle"></h3><p data-i18n="gisPlace"></p></div></div></div></div></section>
    <section id="contact" class="section container contact"><p class="section-kicker" data-i18n="getInTouch"></p><h2 data-i18n="contactTitle"></h2><p data-i18n="contactDesc"></p><div class="actions"><a class="button primary" href="mailto:frans.e.orneholm@hotmail.com" data-i18n="emailMe"></a><a class="button secondary" href="https://www.linkedin.com/in/frans-orneholm" target="_blank" rel="noopener noreferrer" data-i18n="linkedin"></a><a class="button secondary" href="https://github.com/frans404" target="_blank" rel="noopener noreferrer" data-i18n="github"></a></div></section>
  </main>
  <footer class="container footer"><span>© <span id="year"></span> <span data-i18n="footerName"></span></span><span data-i18n="footer"></span></footer>
</body>
</html>
